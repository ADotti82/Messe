<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#831843" />
      <stop offset="60%" stop-color="#4c0519" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="35%" stop-color="#facc15" />
      <stop offset="70%" stop-color="#ca8a04" />
      <stop offset="100%" stop-color="#854d0e" />
    </linearGradient>
    <radialGradient id="haloGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fde047" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#ca8a04" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background base rounded rectangle with safe zone for icons -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" stroke="#b45309" stroke-width="6" stroke-opacity="0.6"/>

  <!-- Subtle golden border circle -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-opacity="0.5" stroke-dasharray="8 6"/>

  <!-- Golden halo glow -->
  <circle cx="256" cy="240" r="150" fill="url(#haloGrad)"/>

  <!-- Eucharistic Sunburst Rays -->
  <g stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round" opacity="0.4">
    <line x1="256" y1="130" x2="256" y2="90" />
    <line x1="256" y1="350" x2="256" y2="390" />
    <line x1="146" y1="240" x2="106" y2="240" />
    <line x1="366" y1="240" x2="406" y2="240" />
    <line x1="178" y1="162" x2="150" y2="134" />
    <line x1="334" y1="318" x2="362" y2="346" />
    <line x1="178" y1="318" x2="150" y2="346" />
    <line x1="334" y1="162" x2="362" y2="134" />
  </g>

  <!-- Catholic Roman Cross -->
  <g filter="url(#glow)">
    <!-- Vertical stem -->
    <rect x="238" y="120" width="36" height="240" rx="8" fill="url(#goldGrad)" stroke="#78350f" stroke-width="2"/>
    <!-- Horizontal beam -->
    <rect x="166" y="180" width="180" height="36" rx="8" fill="url(#goldGrad)" stroke="#78350f" stroke-width="2"/>

    <!-- Decorative Cross Terminal Serif Accents -->
    <!-- Top terminal -->
    <path d="M 230 128 L 256 104 L 282 128 Z" fill="url(#goldGrad)"/>
    <!-- Bottom terminal -->
    <path d="M 230 352 L 256 376 L 282 352 Z" fill="url(#goldGrad)"/>
    <!-- Left terminal -->
    <path d="M 174 172 L 150 198 L 174 224 Z" fill="url(#goldGrad)"/>
    <!-- Right terminal -->
    <path d="M 338 172 L 362 198 L 338 224 Z" fill="url(#goldGrad)"/>

    <!-- Central Diamond Gem -->
    <polygon points="256,182 272,198 256,214 240,198" fill="#fffbeb" stroke="#b45309" stroke-width="2"/>
  </g>

  <!-- Open Gospel Book below Cross -->
  <g transform="translate(196, 360)">
    <path d="M 60 15 C 40 5 15 5 0 10 L 0 50 C 15 45 40 45 60 55 C 80 45 105 45 120 50 L 120 10 C 105 5 80 5 60 15 Z" fill="#1e293b" stroke="url(#goldGrad)" stroke-width="2.5"/>
    <line x1="60" y1="15" x2="60" y2="55" stroke="url(#goldGrad)" stroke-width="2.5" />
    <!-- Page text marks -->
    <line x1="12" y1="22" x2="48" y2="22" stroke="#94a3b8" stroke-width="1.5" opacity="0.6"/>
    <line x1="12" y1="30" x2="48" y2="30" stroke="#94a3b8" stroke-width="1.5" opacity="0.6"/>
    <line x1="12" y1="38" x2="40" y2="38" stroke="#94a3b8" stroke-width="1.5" opacity="0.6"/>
    <line x1="72" y1="22" x2="108" y2="22" stroke="#94a3b8" stroke-width="1.5" opacity="0.6"/>
    <line x1="72" y1="30" x2="108" y2="30" stroke="#94a3b8" stroke-width="1.5" opacity="0.6"/>
    <line x1="72" y1="38" x2="100" y2="38" stroke="#94a3b8" stroke-width="1.5" opacity="0.6"/>
  </g>
</svg>
